name: parser-hardening

on:
  pull_request:
    paths:
      - "tools/pse_cli/semantic_parser.py"
      - "tools/pse_cli/qa.py"
      - "tools/pse_cli/cli.py"
      - "schema/semantic-ir.schema.json"
      - "tests/regression/semantic_parser.py"
      - "tests/regression/parser_hardening.py"
      - ".github/workflows/parser-hardening.yml"
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  parser:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python tests/regression/semantic_parser.py
      - run: python tests/regression/parser_hardening.py
