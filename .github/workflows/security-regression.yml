name: security-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tests/security/security_regression.py --no-tex
