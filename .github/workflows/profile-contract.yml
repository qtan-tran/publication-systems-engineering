name: profile-contract

on:
  pull_request:
    paths:
      - "profiles/**"
      - "schema/profile.schema.json"
      - "tools/pse_cli/**"
      - "tests/fixtures/profile-books/**"
      - "tests/visual/baselines/**"
      - "tests/regression/profile_contracts.py"
      - "pyproject.toml"
      - ".github/workflows/profile-contract.yml"
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  profile-registry-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: pse profiles --json
      - name: pse doctor (advisory; full TeX toolchain not installed here)
        run: pse doctor --json
        continue-on-error: true

  profile-lifecycle-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-extra texlive-fonts-recommended fonts-sil-gentium poppler-utils
          fc-cache -f
          python -m pip install -e .
      - run: python tests/regression/profile_contracts.py
