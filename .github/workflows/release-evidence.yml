name: release-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  exact-commit-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Remove local packaging build artifacts
        run: python -c "import shutil,glob; [shutil.rmtree(p, ignore_errors=True) for p in ['build'] + glob.glob('*.egg-info') + glob.glob('tools/*.egg-info')]"
      - run: pse --version
      - run: pse profiles --json
      - run: pse modules --json
      - name: pse doctor (advisory; full TeX toolchain not installed here)
        run: pse doctor --json
        continue-on-error: true
      - name: Registry synchronization gate
        run: python scripts/release/sync_registry.py --check
      - name: Output inspection regression
        run: python tests/regression/output_inspection.py
      - run: python tests/regression/release_manifest_contracts.py
      - run: python tests/regression/installed_contract_surface.py
      - name: Exact-commit candidate evidence
        run: python scripts/release/candidate_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ runner.os }}-${{ github.sha }}
          path: tests/_output/release-evidence/
