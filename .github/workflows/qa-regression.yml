name: qa-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  # Cheap, source-only checks run once rather than in six overlapping workflows.
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source integrity before packaging
        run: python tests/regression/public_tree_integrity.py
      - name: Install Python dependencies
        run: python -m pip install .
      - name: Registry and semantic validation
        run: |
          python scripts/release/sync_registry.py --check
          python tests/regression/registry_contracts.py
          python tests/regression/surface_simplification.py
          python tests/regression/semantic_parser.py
          python tests/regression/parser_hardening.py
          python tests/regression/profile_module_policy.py
          python tests/regression/feature_handbook.py
          python tests/regression/profile_handbook.py
          python scripts/docs/validate_docs.py
          python scripts/docs/validate_stable_urls.py
      - name: Security and artifact checks (no TeX)
        run: |
          python tests/security/security_regression.py --no-tex
          python tests/regression/output_inspection.py
          python tests/regression/release_manifest_contracts.py

  # Installed discovery is checked on each host OS without installing a full TeX distribution.
  installed-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: pse --version
      - run: pse profiles --json
      - run: pse modules --json
      - run: python scripts/release/sync_registry.py --check

  # All remaining profiles are built and visually checked on main; PRs get fast hard gates.
  linux-typesetting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra biber fonts-sil-gentiumplus poppler-utils
          python -m pip install -e .
      - run: pse doctor --deep
      - name: Security regression with TeX
        run: python tests/security/security_regression.py
      - name: Core PDF QA on pull requests
        if: github.event_name == 'pull_request'
        run: pse regression --quick --no-visual --output tests/_output/ci-regression-report.json
      - name: Full PDF and visual regression on main
        if: github.event_name != 'pull_request'
        run: pse regression --output tests/_output/ci-regression-report.json
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-qa-regression-report
          path: tests/_output/ci-regression-report.json

  qa-regression:
    name: qa-regression
    needs: [source-contracts, installed-runtime, linux-typesetting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ needs.source-contracts.result != 'success' || needs.installed-runtime.result != 'success' || needs.linux-typesetting.result != 'success' }}
        run: exit 1
