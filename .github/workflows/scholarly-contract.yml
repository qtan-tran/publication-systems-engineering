name: scholarly-contract

on:
  pull_request:
    paths:
      - "modules/**"
      - "profiles/scholarly-edition/**"
      - "schema/module.schema.json"
      - "schema/locator-scheme.schema.json"
      - "tools/pse_cli/**"
      - "tests/regression/scholarly_locator_contracts.py"
      - "pyproject.toml"
      - ".github/workflows/scholarly-contract.yml"
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  scholarly-runtime-registry:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: pse profiles --json
      - run: pse modules --json

  scholarly-lifecycle-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scholarly TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra biber fonts-sil-gentiumplus poppler-utils
          python -m pip install -e .
      - run: pse doctor --profile scholarly-edition --deep
      - run: python tests/regression/scholarly_locator_contracts.py
