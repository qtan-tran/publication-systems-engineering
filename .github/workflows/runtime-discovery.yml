name: runtime-discovery

on:
  push:
    paths:
      - "pyproject.toml"
      - "core/**"
      - "runtime/**"
      - "tools/pse_cli/**"
      - ".github/workflows/runtime-discovery.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "core/**"
      - "runtime/**"
      - "tools/pse_cli/**"
      - ".github/workflows/runtime-discovery.yml"

env:
  PYTHONUTF8: "1"

jobs:
  packaging-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: pse --version
      - name: Verify installed runtime discovery without PSE_ROOT
        shell: python
        run: |
          import os
          import tempfile
          from pathlib import Path
          from pse_cli.cli import _find_runtime
          os.environ.pop("PSE_ROOT", None)
          cwd = os.getcwd()
          with tempfile.TemporaryDirectory() as td:
              os.chdir(td)
              try:
                  runtime = _find_runtime(Path(td))
                  assert runtime.source == "installed-share", runtime
                  assert (runtime.root / "core" / "pse-core.sty").is_file()
                  print(runtime)
              finally:
                  os.chdir(cwd)
