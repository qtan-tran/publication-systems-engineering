name: Bug report
description: Report a reproducible PSE framework defect. Never attach confidential manuscripts.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload unpublished manuscripts, recipient proofs, credentials, or proprietary production files. Use a minimal synthetic reproducer.
  - type: input
    id: version
    attributes:
      label: PSE version
      placeholder: 1.16.0-alpha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and synthetic source only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
