name: Feature request
description: Propose a narrowly scoped framework capability.
title: "[proposal] "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals generic. Do not disclose confidential downstream architecture or proprietary manuscripts.
  - type: textarea
    id: problem
    attributes:
      label: Publishing-system problem
      description: Describe the general problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Likely architectural layer
      options: [core, profile, semantic module, QA, security, release, generator, documentation, unsure]
    validations:
      required: true
