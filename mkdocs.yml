site_name: Publication Systems Engineering
site_description: Documentation for Publication Systems Engineering, a reproducible framework for structured book production.
docs_dir: wiki
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- i18n:
    docs_structure: suffix
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: vi
      name: Tiếng Việt
      build: true
