site_name: Publication Systems Engineering
site_description: Documentation for Publication Systems Engineering, a reproducible framework for structured book production.
docs_dir: wiki
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  language: en
  features:
  - navigation.instant
  - navigation.sections
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search
extra_css:
- assets/stylesheets/pse.css
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- tables
- toc:
    permalink: true
